name: Cancelaciones zona insegura

on:
  workflow_dispatch:
  schedule:
    - cron: "11 15 * * *"  # 11:30 ART (UTC-3)

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: ENV_ZONAINSEGURA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r ZonaInsegura/requirements.txt

      # Cargar variables desde el blob ENV_ZONAINSEGURA (formato KEY=VALUE por línea)
      - name: Cargar variables del blob ENV_ZONAINSEGURA
        run: |
          echo "Cargando variables desde ENV_ZONAINSEGURA..."
          echo "${{ vars.ENV_ZONAINSEGURA }}" | tr -d '\r' | awk 'NF && $0 !~ /^#/ {print}' >> "$GITHUB_ENV"
          echo "Variables cargadas."

      - name: Ejecutar script
        env:
          # Único secreto
          GSERVICE_CREDENTIALS_JSON_CONTENT: ${{ secrets.GSERVICE_CREDENTIALS_JSON_CONTENT }}
        run: python ZonaInsegura/CANCELACION-INSEGURA.py
