name: Ejecutar SimpliRoute ARGENTINA cancelaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22,04 * * *"   # 22:00 y 04:00 UTC (19:00 y 01:00 ART aprox.)
    - cron: "11 11 * * *"     # 11:11 UTC (08:11 ART aprox.)

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ENV_SIMPLIAR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f SimpliRoute/requirements.txt ]; then
            pip install -r SimpliRoute/requirements.txt
          else
            pip install selenium webdriver-manager slack_sdk oauth2client gspread pandas tzdata
          fi
          python -c "import pandas, selenium, gspread; print('✅ Dependencias cargadas')"

      - name: Cargar variables del blob ENV_SIMPLIAR
        run: |
          echo "Cargando variables desde ENV_SIMPLIAR..."
          echo "${{ vars.ENV_SIMPLIAR }}" | tr -d '\r' | awk 'NF && $0 !~ /^#/ {print}' >> "$GITHUB_ENV"
          echo "Variables cargadas."

      # (opcional) Verificar que están las vars requeridas, sin imprimir valores
      - name: Verificar variables requeridas
        run: |
          for v in SIMPLIROUTE_USER SIMPLIROUTE_PASSWORD SHEET_ID GSHEET_WORKSHEET SLACK_BOT_TOKEN SLACK_CHANNEL_ID; do
            if [ -z "${!v}" ]; then echo "FALTA: $v"; exit 1; else echo "OK: $v"; fi
          done

      - name: Ejecutar script (headless + logs en tiempo real)
        env:
          GSERVICE_CREDENTIALS_JSON_CONTENT: ${{ secrets.GSERVICE_CREDENTIALS_JSON_CONTENT }}
          GOOGLE_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 20m python -u SimpliRoute/simplirouteAR_cancelaciones.py

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simpliroute-debug
          path: |
            chromedriver.log
            **/*.png
